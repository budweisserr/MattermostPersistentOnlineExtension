<!DOCTYPE html>
<html>
<head>
  <title>Mattermost Persistent Online Status</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h2>Mattermost Persistent Online Status</h2>
  <div id="statusMessage" class="status-message">Loading...</div>
  <div class="toggle-container">
    <span>Keep Online</span>
    <label class="switch">
      <input type="checkbox" id="autoStatusSwitch">
      <span class="slider round"></span>
    </label>
    <span id="toggleLabel" class="toggle-label">OFF</span>
  </div>
  <button id="scanButton">Connect to Mattermost</button>
  <div id="scanResult"></div>
  <script src="popup.js"></script>
</body>
</html>
